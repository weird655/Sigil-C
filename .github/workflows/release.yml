name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v1.1)"
        required: true
        default: "v1.1"

permissions:
  contents: write

jobs:
  release:
    name: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          body: |
            See `CHANGELOG.md` for the full list.

            Install / run:

            ```bash
            pip install -e .
            sigilc --version
            ```
