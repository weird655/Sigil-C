<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIGIL-C // IDA GRAPH TERMINAL</title>
<style>
:root{--bg:#ffffff;--panel:#f8fafc;--panel-bar:#f1f5f9;--line:#cbd5e1;--line-dark:#475569;--text:#0f172a;--text-dim:#64748b;--text-bright:#0284c7;--border:#94a3b8;--font-term:"Consolas","Courier New",ui-monospace,Menlo,Monaco,monospace}
*{box-sizing:border-box;border-radius:0!important;outline:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:12px/1.4 var(--font-term);letter-spacing:.02em;overflow:hidden}
#app{display:grid;grid-template-columns:1fr 340px;grid-template-rows:42px 1fr;height:100%}
header{grid-column:1/3;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--panel-bar);border-bottom:1px solid var(--line);position:relative;z-index:10}
header b{font-size:12px;color:var(--text);letter-spacing:.08em;white-space:nowrap;font-weight:700}
header .prompt{color:var(--text-dim);font-size:11px}
header .stat{color:var(--text-dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px;border-left:1px solid var(--line);padding-left:8px}
.search-box{display:flex;align-items:center;background:#fff;border:1px solid var(--line);padding:2px 6px;gap:4px;margin-left:6px}
.search-box input{background:none;border:none;color:var(--text);font:11px var(--font-term);width:110px}
.search-box .clear-btn{cursor:pointer;color:var(--text-dim);font-size:10px;display:none;background:none;border:none;padding:0}
.search-box .clear-btn:hover{color:var(--text)}.search-box .match-badge{font-size:10px;color:var(--text-bright);font-weight:700}
#toolbar{margin-left:auto;display:flex;align-items:center;gap:4px}
button,select{background:#fff;color:var(--text);border:1px solid var(--line);padding:3px 7px;cursor:pointer;font:11px var(--font-term);letter-spacing:.04em;text-transform:uppercase;transition:all .1s}
button:hover,select:hover{background:var(--panel-bar);border-color:var(--line-dark);color:var(--text-bright)}button:active{background:#e2e8f0}select option{background:#fff;color:var(--text)}
#stage{position:relative;overflow:hidden;background:#ffffff}
#wind{display:none}#svg{position:relative;z-index:1;width:100%;height:100%;display:block;cursor:default}#svg.panning{cursor:grab}
#filter-bar{position:absolute;top:8px;left:10px;z-index:4;display:flex;gap:3px;flex-wrap:wrap;background:rgba(255,255,255,.94);padding:3px 6px;border:1px solid var(--line)}
.filter-chip{background:#fff;color:var(--text-dim);border:1px solid var(--line);padding:1px 5px;font-size:10px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.filter-chip:hover{color:var(--text);border-color:var(--line-dark)}.filter-chip.active{background:var(--text);color:#fff;border-color:var(--text);font-weight:700}
#hud-zoom{position:absolute;right:10px;top:8px;z-index:4;background:rgba(255,255,255,.94);border:1px solid var(--line);padding:2px 6px;font-size:11px;color:var(--text-dim)}
#panel{background:var(--panel);border-left:1px solid var(--line);padding:12px;overflow-y:auto;position:relative;z-index:5}
#panel h2{font-size:11px;margin:12px 0 4px;color:var(--text-dim);letter-spacing:.08em;border-bottom:1px solid var(--line);padding-bottom:2px;cursor:pointer;display:flex;justify-content:space-between;user-select:none}
#panel h2:hover{color:var(--text-bright)}
#panel .label{font-size:14px;font-weight:700;margin-bottom:2px;word-break:break-all;color:var(--text)}#panel .kind{display:inline-block;font-size:10px;color:var(--text-dim);margin-bottom:8px}
#panel .actions{display:flex;gap:4px;margin:6px 0 10px}#panel .actions button{font-size:10px;padding:3px 6px;flex:1}
#panel ul{padding-left:0;margin:4px 0 10px;list-style:none}#panel ul.collapsed{display:none}
#panel li{color:var(--text-dim);margin:3px 0;padding:4px 6px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;gap:6px;font-size:11px;cursor:pointer}
#panel li:hover{border-color:var(--text-bright);color:var(--text);background:#f0f9ff}#panel li b{color:var(--text);font-weight:600}#panel li .tag{margin-left:auto;font-size:9px;color:var(--text-dim);background:var(--panel-bar);padding:1px 4px;border:1px solid var(--line)}
#legend{position:absolute;left:10px;bottom:8px;z-index:2;background:rgba(255,255,255,.94);border:1px solid var(--line);padding:4px 8px;display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100% - 20px)}
#legend span{display:inline-flex;align-items:center;gap:4px;color:var(--text-dim);font-size:10px}.dot{width:7px;height:7px;border:1px solid #64748b;display:inline-block}
#hint{position:absolute;right:10px;bottom:8px;z-index:2;color:var(--text-dim);font-size:10px;background:rgba(255,255,255,.94);padding:3px 6px;border:1px solid var(--line)}
#drop{position:absolute;inset:0;z-index:8;display:none;place-items:center;background:rgba(241,245,249,.85)}#drop.hot{display:grid}
#drop .box{width:min(480px,90%);padding:28px;border:2px dashed var(--line-dark);background:#fff;text-align:center;color:var(--text)}#drop small{display:block;margin-top:8px;color:var(--text-dim);font-size:10px}
#drop .preset-row{margin-top:14px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.node{cursor:pointer;transition:opacity .1s}.node text{font-size:11px;pointer-events:none;user-select:none;font-family:var(--font-term)}
.node .node-box{stroke-width:1;stroke:var(--line-dark);fill:#ffffff}.node .node-header{stroke-width:1;stroke:var(--line-dark)}
.node:hover .node-box{stroke:#0284c7;stroke-width:1.5}.node.selected .node-box{stroke:#0284c7;stroke-width:2.5;fill:#f0f9ff}.node.match .node-box{stroke:#d97706;stroke-width:2}.node.dim{opacity:.12}
.edge{fill:none;stroke:#64748b;stroke-width:1.3}.edge.hl{stroke:#0284c7;stroke-width:2.2}.edge.dim{opacity:.10}
@keyframes signalFlow{0%{stroke-dashoffset:24}100%{stroke-dashoffset:0}}
.edge.pulse{stroke:#0284c7!important;stroke-width:2.4!important;stroke-dasharray:4 3;animation:signalFlow .5s linear infinite}
.edge-label{fill:#475569;font-size:9px;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:2px;opacity:0;font-family:var(--font-term)}.edge-label.hl{fill:#0284c7;opacity:1}.show-labels .edge-label{opacity:1}
.via{fill:#475569;stroke:#fff;stroke-width:1}.frame{fill:none;stroke-dasharray:4 3;stroke-width:1.2;cursor:pointer}.frame-bg{fill:rgba(248,250,252,.5);cursor:pointer}.frame-btn{font-size:10px;font-family:var(--font-term);cursor:pointer;user-select:none}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:#f1f5f9}::-webkit-scrollbar-thumb{background:#cbd5e1}
@media (max-width:820px){#app{grid-template-columns:1fr;grid-template-rows:42px 1fr 220px}#panel{border-left:0;border-top:1px solid var(--line)}.search-box{display:none}}
</style>
</head>
<body>
<div id="app">
<header>
  <b>[IDA GRAPH]</b><span class="prompt">&gt; NETLIST_CFG</span><span class="stat" id="stats"></span>
  <div class="search-box">
    <input id="search-input" type="text" placeholder="FILTER..." spellcheck="false">
    <button class="clear-btn" id="search-clear">[X]</button><span class="match-badge" id="search-count"></span>
  </div>
  <div id="toolbar">
    <select id="preset-select" title="Load demo graph">
      <option value="">[PRESETS / 预设]</option>
      <option value="netgraph">PROJECT: MULTI_NS</option>
      <option value="ladder">LADDER: 15_PTR</option>
      <option value="slices">SLICES: BIT_BYTE</option>
      <option value="landmine">LOCK: LANDMINE_GATES</option>
    </select>
    <button id="fit">[FIT / 适配]</button><button id="reset">[RESET / 重置]</button>
    <button id="fold-all" title="Toggle all namespace folds">[FOLD / 折叠全部]</button>
    <button id="wire-style">[ORTHO / 正交]</button><button id="labels">[LABELS / 连线名]</button>
    <button id="lang-btn">[EN / 中文]</button>
  </div>
</header>
<div id="stage">
  <canvas id="wind"></canvas>
  <div id="filter-bar"></div>
  <div id="hud-zoom"><span id="zoom-val">100%</span></div>
  <svg id="svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
      <marker id="arrow-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker>
    </defs>
    <g id="viewport"><g id="frames"></g><g id="edges"></g><g id="nodes"></g></g>
  </svg>
  <div id="drop">
    <div class="box">[ DROP GRAPH .JSON ]<br><small>&gt; sigilc --netlist --netlist-format json -o graph.json</small>
      <div class="preset-row"><button onclick="loadPreset('netgraph')">[DEMO_PROJECT]</button><button onclick="loadPreset('ladder')">[15_LADDER]</button><button onclick="loadPreset('slices')">[SLICES]</button></div>
    </div>
  </div>
  <div id="legend"></div><div id="hint">[DRAG:PAN · WHEEL:ZOOM · CLICK:INSPECT]</div>
</div>
<aside id="panel"><h2>[INSPECTOR / 检视器]</h2><div id="detail">&gt; AWAITING TARGET SELECTION.</div></aside>
</div>
<script>
const EMBEDDED = {"objects": [], "morphisms": [], "namespaces": []};
let lang = "zh";
const I18N = {
  zh: {

    hint: "[鼠标拖拽:平移 · 滚轮:缩放 · 点击框头:折叠/展开]",
    kinds: {namespace:"命名空间",package:"包",target:"目标",field:"切片",group:"组",gate:"门",landmine:"地雷",slot:"槽",alias:"别名",file:"文件",project:"工程",plant:"发电厂"}
  },
  en: {

    center: "[CENTER]", copyRef: "[COPY REF]", copied: "[COPIED]", endpoints: "[ENDPOINTS]", source: "SOURCE", target: "TARGET", morphism: "MORPHISM",
    hint: "[DRAG:PAN · WHEEL:ZOOM · CLICK HEADER:FOLD/EXPAND]",
    kinds: {namespace:"NAMESPACE",package:"PACKAGE",target:"TARGET",field:"SLICE",group:"GROUP",gate:"GATE",landmine:"LANDMINE",slot:"SLOT",alias:"ALIAS",file:"FILE",project:"PROJECT",plant:"PLANT"}
  }
};
const KIND_HEADER = {plant:"#ede9fe",namespace:"#e0f2fe",package:"#dcfce7",target:"#fef3c7",field:"#f3e8ff",group:"#fee2e2",gate:"#ffedd5",landmine:"#fee2e2",slot:"#f1f5f9",alias:"#e0f2fe",file:"#f1f5f9",project:"#f8fafc"};
const KIND_COLOR = {plant:"#7c3aed",namespace:"#0284c7",package:"#16a34a",target:"#d97706",field:"#9333ea",group:"#dc2626",gate:"#ea580c",landmine:"#dc2626",slot:"#475569",alias:"#0284c7",file:"#475569",project:"#0f172a"};
const EDGE_COLOR = {in:"#0284c7",binds:"#16a34a",alias:"#0284c7",field:"#9333ea",member:"#dc2626",gates:"#ea580c",allows:"#ea580c",confined:"#dc2626",armed:"#dc2626",bound:"#dc2626","in-file":"#64748b","in-project":"#334155",uses:"#d97706","uses-local":"#d97706","gates-file":"#dc2626","in-plant":"#7c3aed",powers:"#7c3aed"};
const LAYER = {plant:-1,project:0,file:0,namespace:1,group:2,gate:2,package:3,field:4,alias:4,slot:5,target:5,landmine:5};
let wireStyle = "ortho", activeKindFilter = null, searchQuery = "", selectedNodeId = null;
const collapsedSets = new Set();
const PRESETS = {
  netgraph: {"namespace": null, "namespaces": ["main", "math"], "project": "project:netgraph-src", "objects": [{"id": "project:netgraph-src", "label": "project:netgraph-src", "kind": "project"}, {"id": "file:!main!\\main.sigil", "label": "!main!\\main.sigil", "kind": "file"}, {"id": "ns:main", "label": "!main!/", "kind": "namespace"}, {"id": "file:!math!\\core.sigil", "label": "!math!\\core.sigil", "kind": "file"}, {"id": "ns:math", "label": "!math!/", "kind": "namespace"}, {"id": "file:!math!\\core.sigil:pkg:1", "label": "!1! P", "kind": "package"}, {"id": "file:!math!\\core.sigil:target:add", "label": "add", "kind": "target"}, {"id": "file:!math!\\core.sigil:alias:P", "label": "P", "kind": "alias"}], "morphisms": [{"source": "file:!main!\\main.sigil", "target": "ns:main", "kind": "in-file", "label": "in file"}, {"source": "file:!math!\\core.sigil", "target": "ns:math", "kind": "in-file", "label": "in file"}, {"source": "file:!main!\\main.sigil", "target": "file:!math!\\core.sigil:pkg:1", "kind": "uses", "label": "!math[1]!"}, {"source": "file:!math!\\core.sigil:pkg:1", "target": "ns:math", "kind": "in", "label": "in namespace"}, {"source": "file:!math!\\core.sigil:pkg:1", "target": "file:!math!\\core.sigil:target:add", "kind": "binds", "label": "binds"}, {"source": "file:!math!\\core.sigil:alias:P", "target": "file:!math!\\core.sigil:target:add", "kind": "alias", "label": "alias"}, {"source": "ns:main", "target": "project:netgraph-src", "kind": "in-project", "label": "in project"}, {"source": "ns:math", "target": "project:netgraph-src", "kind": "in-project", "label": "in project"}], "category": {"objects": 8, "morphisms": 8, "composition": "files contain namespaces; namespaces contain packages; uses edges cross files"}},
  ladder: (function(){ const o=[{id:"target:root_x",label:"root_x:i4",kind:"target"}],m=[]; for(let i=1;i<=15;i++){ o.push({id:`pkg:${i}`,label:`!${i}! P${i}`,kind:"package"}); m.push({source:`pkg:${i}`,target:i===1?"target:root_x":`pkg:${i-1}`,kind:"binds",label:i===1?"binds":`!/${i-1}/!`}); } return {namespace:"ladder",namespaces:["ladder"],project:"project:ladder-15p",objects:o,morphisms:m,category:{objects:16,morphisms:15,composition:"15-level pointer ladder"}}; })(),
  slices: {namespace:"hw",namespaces:["hw"],project:"project:slice-pack",objects:[{id:"target:reg_cfg",label:"REG_CONFIG",kind:"target"},{id:"pkg:1",label:"!1! Enable",kind:"package"},{id:"field:en",label:"bits(cfg,0,1)",kind:"field"},{id:"pkg:2",label:"!2! BaudRate",kind:"package"},{id:"field:baud",label:"bits(cfg,4,3)",kind:"field"},{id:"pkg:3",label:"!3! LowByte",kind:"package"},{id:"field:byte0",label:"byte(cfg,0)",kind:"field"}],morphisms:[{source:"field:en",target:"target:reg_cfg",kind:"field",label:"bit 0"},{source:"pkg:1",target:"field:en",kind:"binds",label:"binds"},{source:"field:baud",target:"target:reg_cfg",kind:"field",label:"bits 4..6"},{source:"pkg:2",target:"field:baud",kind:"binds",label:"binds"},{source:"field:byte0",target:"target:reg_cfg",kind:"field",label:"byte 0"},{source:"pkg:3",target:"field:byte0",kind:"binds",label:"binds"}],category:{objects:7,morphisms:6,composition:"bitfield slicing"}},
  landmine: {namespace:"sec",namespaces:["sec"],project:"project:landmine-grid",objects:[{id:"pkg:1",label:"!1!! GuardKey",kind:"landmine"},{id:"target:vault",label:"crypto_vault",kind:"target"},{id:"gate:gateA",label:"gate:Alpha",kind:"gate"},{id:"group:grpA",label:"group:Ring0",kind:"group"},{id:"pkg:2",label:"!2! Worker",kind:"package"}],morphisms:[{source:"pkg:1",target:"target:vault",kind:"bound",label:"single-bind"},{source:"gate:gateA",target:"pkg:1",kind:"gates",label:"protects"},{source:"group:grpA",target:"gate:gateA",kind:"confined",label:"confines"},{source:"pkg:2",target:"group:grpA",kind:"member",label:"member"}],category:{objects:5,morphisms:4,composition:"landmine single-binding lockdown"}}
};
const svg=document.getElementById("svg"), viewport=document.getElementById("viewport");
const frames=document.getElementById("frames"), edgeLayer=document.getElementById("edges"), nodeLayer=document.getElementById("nodes");
const panel=document.getElementById("detail"), stats=document.getElementById("stats"), drop=document.getElementById("drop");
let GRAPH={objects:[],morphisms:[],namespaces:[]}, nodes=[], edges=[], byId=new Map(), adj=new Map();
const nodeEls=new Map(); let edgeEls=[];
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function initLayout(){
  const layers = {};nodes.forEach(n=>{const l = LAYER[n.kind] ?? 3;(layers[l] = layers[l] || []).push(n);});
  const maxNodes = Math.max(...Object.values(layers).map(a=>a.length), 1);
  const baseX = 140 + maxNodes * 115;
  Object.keys(layers).sort((a,b)=>+a-(+b)).forEach(lvl=>{
    const arr = layers[lvl];arr.sort((a,b)=>a.label.localeCompare(b.label));const count = arr.length;
    const spacingX = Math.max(220, Math.min(270, 960 / Math.max(count, 1)));
    const y = 80 + lvl * 135;
    arr.forEach((n, idx)=>{n.x = baseX + (idx - (count - 1) / 2) * spacingX; n.y = y;});
  });
}
function shapeFor(kind){return {w:180,h:54,hdr:18};}
const proj=n=>({x:n.x,y:n.y});
function addVia(x,y){const c=document.createElementNS("http://www.w3.org/2000/svg","circle");c.classList.add("via");c.setAttribute("cx",x);c.setAttribute("cy",y);c.setAttribute("r",2.5);frames.append(c);}
function frameFor(kind,title,members,color,key){
  if(!members.length)return;
  const isCollapsed = Boolean(key && collapsedSets.has(key));
  let x, y, w, h;
  if(isCollapsed){
    const avgX = members.reduce((s,n)=>s+n.x,0) / members.length;
    const avgY = members.reduce((s,n)=>s+n.y,0) / members.length;
    w = 210; h = 34; x = avgX - w/2; y = avgY - h/2;
  } else {
    const minX = Math.min(...members.map(n => n.x - n.w/2)), maxX = Math.max(...members.map(n => n.x + n.w/2));
    const minY = Math.min(...members.map(n => n.y - n.h/2)), maxY = Math.max(...members.map(n => n.y + n.h/2));
    x = minX - 16; y = minY - 26; w = (maxX - minX) + 32; h = (maxY - minY) + 40;
  }
  const bg = document.createElementNS("http://www.w3.org/2000/svg","rect");
  bg.classList.add("frame-bg");bg.setAttribute("x",x);bg.setAttribute("y",y);bg.setAttribute("width",w);bg.setAttribute("height",h);
  const r = document.createElementNS("http://www.w3.org/2000/svg","rect");
  r.classList.add("frame");r.setAttribute("x",x);r.setAttribute("y",y);r.setAttribute("width",w);r.setAttribute("height",h);r.setAttribute("stroke",color);
  const t = document.createElementNS("http://www.w3.org/2000/svg","text");
  t.classList.add("frame-btn");t.setAttribute("x",x+8);t.setAttribute("y",y+15);t.setAttribute("fill",color);t.setAttribute("font-weight","700");
  t.textContent = isCollapsed ? `[+] ${title} (${members.length})` : `[-] ${title}`;
  if(key){
    const toggle = ()=>{
      if(collapsedSets.has(key)) collapsedSets.delete(key); else collapsedSets.add(key);
      draw();
    };
    bg.onclick = toggle; r.onclick = toggle; t.onclick = toggle;
  }
  frames.append(bg, r, t);
}
function renderKindFilters(){
  const bar=document.getElementById("filter-bar");bar.replaceChildren();const counts={};nodes.forEach(n=>{counts[n.kind]=(counts[n.kind]||0)+1;});
  const allChip=document.createElement("span");allChip.className="filter-chip"+(activeKindFilter===null?" active":"");allChip.textContent=`* (${nodes.length})`;allChip.onclick=()=>{activeKindFilter=null;renderKindFilters();updateFilterDisplay();};bar.append(allChip);
  const t = I18N[lang].kinds;
  Object.keys(counts).sort().forEach(k=>{const chip=document.createElement("span");chip.className="filter-chip"+(activeKindFilter===k?" active":"");chip.innerHTML=`<i class="dot" style="background:${KIND_HEADER[k]||'#fff'}"></i>${t[k]||k} (${counts[k]})`;chip.onclick=()=>{activeKindFilter=(activeKindFilter===k?null:k);renderKindFilters();updateFilterDisplay();};bar.append(chip);});
}
function updateFilterDisplay(){
  const q=searchQuery.toLowerCase().trim();let matchCount=0;
  nodes.forEach(n=>{const el=nodeEls.get(n.id);if(!el)return;const km=(activeKindFilter===null||n.kind===activeKindFilter);const tm=(!q||n.label.toLowerCase().includes(q)||n.id.toLowerCase().includes(q));const act=km&&tm;if(act)matchCount++;el.classList.toggle("dim",!act);el.classList.toggle("match",Boolean(q&&tm));});
  const countBadge=document.getElementById("search-count");if(q){countBadge.textContent=`[${matchCount}/${nodes.length}]`;document.getElementById("search-clear").style.display="inline";}else{countBadge.textContent="";document.getElementById("search-clear").style.display="none";}
  edgeEls.forEach(({p,t,e})=>{const a=byId.get(e.source),b=byId.get(e.target);const vis=a&&b&&!nodeEls.get(a.id)?.classList.contains("dim")&&!nodeEls.get(b.id)?.classList.contains("dim");p.classList.toggle("dim",!vis);t.classList.toggle("dim",!vis);});
}
function buildGraph(data){
  if(!data||!Array.isArray(data.objects)||!Array.isArray(data.morphisms))throw new Error("not a netlist graph JSON");
  GRAPH=data;nodes=data.objects.map((o,i)=>({...o,x:0,y:0,idx:i}));byId=new Map(nodes.map(n=>[n.id,n]));edges=data.morphisms.filter(e=>byId.has(e.source)&&byId.has(e.target));
  adj=new Map(nodes.map(n=>[n.id,{out:[],in:[]}]));edges.forEach((e,i)=>{e.idx=i;adj.get(e.source).out.push(e);adj.get(e.target).in.push(e);});
  nodeEls.clear();edgeEls=[];nodeLayer.replaceChildren();edgeLayer.replaceChildren();document.getElementById("legend").replaceChildren();
  const t = I18N[lang].kinds;
  nodes.forEach(n=>{
    const g=document.createElementNS("http://www.w3.org/2000/svg","g");g.classList.add("node");g.dataset.id=n.id;
    const sh=shapeFor(n.kind);n.w=sh.w;n.h=sh.h;

    const th=document.createElementNS("http://www.w3.org/2000/svg","text");th.setAttribute("x",6);th.setAttribute("y",13);th.setAttribute("fill",KIND_COLOR[n.kind]||"#334155");th.setAttribute("font-size","9");th.setAttribute("font-weight","700");th.textContent=`[${(t[n.kind]||n.kind).toUpperCase()}]`;
    const tb=document.createElementNS("http://www.w3.org/2000/svg","text");tb.setAttribute("x",8);tb.setAttribute("y",38);tb.setAttribute("fill","#0f172a");tb.setAttribute("font-size","11");tb.setAttribute("font-weight","600");tb.textContent=n.label.length>22?n.label.slice(0,21)+"…":n.label;
    g.append(box,hdr,th,tb);nodeLayer.append(g);nodeEls.set(n.id,g);
  });
  edges.forEach((e,i)=>{

    const t=document.createElementNS("http://www.w3.org/2000/svg","text");t.classList.add("edge-label");t.textContent=e.label;edgeLayer.append(p,t);edgeEls.push({p,t,e});

function draw(){
  frames.replaceChildren();
  const hiddenNodeIds = new Set();
  const nsList = GRAPH.namespaces || (GRAPH.namespace ? [GRAPH.namespace] : []);
  nsList.forEach(ns=>{
    const nsKey = `ns:${ns}`;
    const ids = new Set(nodes.filter(n=>n.kind!=="file"&&n.kind!=="project"&&edges.some(e=>e.target===nsKey&&e.source===n.id)).map(n=>n.id));
    let changed = true;
    while(changed){changed=false;edges.forEach(e=>{if(ids.has(e.source)&&!ids.has(e.target)&&["binds","field","alias","local-alias"].includes(e.kind)){ids.add(e.target);changed=true;}});}
    const members = nodes.filter(n=>ids.has(n.id));
    if(collapsedSets.has(nsKey)){members.forEach(n=>hiddenNodeIds.add(n.id));}
    frameFor("namespace",`set: !${ns}!/`,members,KIND_COLOR.namespace,nsKey);
  });
  nodes.filter(n=>n.kind==="group").forEach(g=>{
    const grpKey = g.id;
    const m = edges.filter(e=>e.source===g.id&&e.kind==="member").map(e=>byId.get(e.target)).filter(Boolean);
    if(collapsedSets.has(grpKey)){m.forEach(n=>hiddenNodeIds.add(n.id));}
    frameFor("group",`set: ${g.label}`,m,KIND_COLOR.group,grpKey);
  });
  nodes.forEach(n=>{
    const el = nodeEls.get(n.id);
    if(el) el.style.display = hiddenNodeIds.has(n.id) ? "none" : "";
  });
  const pairCount = new Map();
  edges.forEach(e=>{const k=[e.source,e.target].sort().join("|");pairCount.set(k,(pairCount.get(k)||0)+1);});
  const pairSeen = new Map();
  edgeEls.forEach(({p,t,e})=>{
    const a = byId.get(e.source), b = byId.get(e.target);
    if(!a||!b||hiddenNodeIds.has(a.id)||hiddenNodeIds.has(b.id)){
      p.style.display="none";t.style.display="none";return;
    }
    p.style.display="";t.style.display="";
    const k=[e.source,e.target].sort().join("|"),n=pairCount.get(k),s=pairSeen.get(k)||0;pairSeen.set(k,s+1);
    const pa=proj(a),pb=proj(b),off=(s-(n-1)/2)*16;
    if(wireStyle==="ortho"){
      const my=(pa.y+pb.y)/2+off;
      p.setAttribute("d",`M ${pa.x} ${pa.y+a.h/2} V ${my} H ${pb.x} V ${pb.y-b.h/2}`);
      t.setAttribute("x",(pa.x+pb.x)/2);t.setAttribute("y",my-3);t.setAttribute("text-anchor","middle");
      addVia(pa.x,my);addVia(pb.x,my);
    } else {
      const dy=Math.max(30,Math.abs(pb.y-pa.y)*0.5);
      p.setAttribute("d",`M ${pa.x} ${pa.y+a.h/2} C ${pa.x} ${pa.y+dy+off}, ${pb.x} ${pb.y-dy+off}, ${pb.x} ${pb.y-b.h/2}`);
      t.setAttribute("x",(pa.x+pb.x)/2);t.setAttribute("y",(pa.y+pb.y)/2+off-5);t.setAttribute("text-anchor","middle");
    }
  });
  nodes.forEach(n=>{const g=nodeEls.get(n.id);const q=proj(n);g.setAttribute("transform",`translate(${q.x-n.w/2},${q.y-n.h/2})`);});
}
let view={x:0,y:0,k:1};
function applyTransform(){viewport.setAttribute("transform",`translate(${view.x},${view.y}) scale(${view.k})`);document.getElementById("zoom-val").textContent=Math.round(view.k*100)+"%";}
function fit(){
  if(!nodes.length){view={x:0,y:0,k:1};applyTransform();return;}
  const visible = nodes.filter(n=>nodeEls.get(n.id)?.style.display!=="none");
  const targetNodes = visible.length ? visible : nodes;
  const xs=targetNodes.map(n=>n.x),ys=targetNodes.map(n=>n.y);const x=Math.min(...xs)-180,y=Math.min(...ys)-120,w=Math.max(...xs)-x+280,h=Math.max(...ys)-y+200,r=svg.getBoundingClientRect();
  view.k=Math.min(1.4,Math.min(r.width/w,r.height/h));view.x=(r.width-w*view.k)/2-x*view.k;view.y=(r.height-h*view.k)/2-y*view.k;applyTransform();
}
function focusNode(id){const n=byId.get(id);if(!n)return;const r=svg.getBoundingClientRect();view.k=1.1;view.x=r.width/2-n.x*view.k;view.y=r.height/2-n.y*view.k;applyTransform();select(id);}
let drag=null,pan=null;
svg.addEventListener("pointerdown",ev=>{
  const g=ev.target.closest&&ev.target.closest(".node");if(g){const n=byId.get(g.dataset.id);drag={n,dx:ev.clientX,dy:ev.clientY,ox:n.x,oy:n.y};svg.setPointerCapture(ev.pointerId);return;}
  pan={x:ev.clientX,y:ev.clientY,vx:view.x,vy:view.y};svg.classList.add("panning");svg.setPointerCapture(ev.pointerId);
});
svg.addEventListener("pointermove",ev=>{
  if(drag){drag.n.x=drag.ox+(ev.clientX-drag.dx)/view.k;drag.n.y=drag.oy+(ev.clientY-drag.dy)/view.k;draw();return;}
  if(pan){view.x=pan.vx+ev.clientX-pan.x;view.y=pan.vy+ev.clientY-pan.y;applyTransform();}
});
svg.addEventListener("pointerup",()=>{drag=null;pan=null;svg.classList.remove("panning");});
svg.addEventListener("wheel",ev=>{
  ev.preventDefault();const r=svg.getBoundingClientRect(),mx=ev.clientX-r.left,my=ev.clientY-r.top;const k=Math.max(.2,Math.min(3.0,view.k*(ev.deltaY<0?1.12:.89)));
  view.x=mx-(mx-view.x)*k/view.k;view.y=my-(my-view.y)*k/view.k;view.k=k;applyTransform();
},{passive:false});
document.getElementById("fit").onclick=fit;document.getElementById("reset").onclick=()=>{initLayout();draw();fit();};document.getElementById("labels").onclick=()=>document.body.classList.toggle("show-labels");
document.getElementById("wire-style").onclick=function(){wireStyle=(wireStyle==="ortho"?"bezier":"ortho");this.textContent=(wireStyle==="ortho"?"[ORTHO / 正交]":"[CURVE / 曲线]");draw();};
document.getElementById("fold-all").onclick=function(){
  const nsList = GRAPH.namespaces || (GRAPH.namespace ? [GRAPH.namespace] : []);
  const allCollapsed = nsList.length && nsList.every(ns=>collapsedSets.has(`ns:${ns}`));
  if(allCollapsed){collapsedSets.clear();} else {nsList.forEach(ns=>collapsedSets.add(`ns:${ns}`));}
  draw();fit();
};
document.getElementById("lang-btn").onclick=function(){
  lang = (lang==="zh"?"en":"zh");this.textContent = (lang==="zh"?"[EN / 中文]":"[ZH / ENGLISH]");
  document.querySelector("#hint").textContent = I18N[lang].hint;document.querySelector("#panel h2 span").textContent = I18N[lang].inspector;

document.getElementById("preset-select").onchange=function(){if(!this.value)return;loadPreset(this.value);this.value="";};
function loadPreset(key){if(PRESETS[key]){collapsedSets.clear();buildGraph(PRESETS[key]);drop.style.display="none";}}
function select(id){

  edgeEls.forEach(({p,t,e})=>{const hl=e.source===id||e.target===id;p.classList.toggle("hl",hl);p.classList.toggle("pulse",hl);t.classList.toggle("hl",hl);p.classList.toggle("dim",!hl&&activeKindFilter===null&&!searchQuery);t.classList.toggle("dim",!hl&&activeKindFilter===null&&!searchQuery);p.setAttribute("marker-end",hl?"url(#arrow-hl)":"url(#arrow)");});
  const n=byId.get(id);if(!n)return;const a=adj.get(id);const t = I18N[lang];
  panel.innerHTML=`

    <h2 onclick="toggleSection('out-list')"><span>${t.egress} [${a.out.length}]</span><span id="out-list-btn">[-]</span></h2>
    <ul id="out-list">${a.out.length?a.out.map(e=>`<li onclick="select('${esc(e.target)}')"><b>${esc(e.kind)}</b> -&gt; ${esc(e.target)} <span class="tag">${esc(e.label)}</span></li>`).join(""):`<li style='cursor:default'>${t.none}</li>`}</ul>
    <h2 onclick="toggleSection('in-list')"><span>${t.ingress} [${a.in.length}]</span><span id="in-list-btn">[-]</span></h2>
    <ul id="in-list">${a.in.length?a.in.map(e=>`<li onclick="select('${esc(e.source)}')"><b>${esc(e.kind)}</b> &lt;- ${esc(e.source)} <span class="tag">${esc(e.label)}</span></li>`).join(""):`<li style='cursor:default'>${t.none}</li>`}</ul>
  `;

function toggleSection(id){

nodeLayer.addEventListener("click",ev=>{const g=ev.target.closest(".node");if(g)select(g.dataset.id);});

  const p=ev.target.closest(".edge");if(!p)return;const {e}=edgeEls[+p.dataset.idx];const t=I18N[lang];
  panel.innerHTML=`<div class="label">${t.morphism}</div><div class="kind">[${esc(e.kind)}] · ${esc(e.label)}</div><h2><span>${t.endpoints}</span></h2><ul><li onclick="focusNode('${esc(e.source)}')"><b>${t.source}</b> ${esc(e.source)}</li><li onclick="focusNode('${esc(e.target)}')"><b>${t.target}</b> ${esc(e.target)}</li></ul>`;
});
const searchInput=document.getElementById("search-input");searchInput.addEventListener("input",e=>{searchQuery=e.target.value;updateFilterDisplay();});document.getElementById("search-clear").onclick=()=>{searchInput.value="";searchQuery="";updateFilterDisplay();};
drop.addEventListener("dragover",ev=>{ev.preventDefault();drop.classList.add("hot");});drop.addEventListener("dragleave",()=>drop.classList.remove("hot"));window.addEventListener("dragover",ev=>{ev.preventDefault();drop.classList.add("hot");});

function startWind(){}
if(typeof EMBEDDED!=="undefined"&&EMBEDDED&&EMBEDDED.objects&&EMBEDDED.objects.length){buildGraph(EMBEDDED);}
else{drop.style.display="grid";}
