<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIGIL-C // IDA GRAPH TERMINAL</title>
<style>
:root{--bg:#ffffff;--panel:#f8fafc;--panel-bar:#f1f5f9;--line:#cbd5e1;--line-dark:#475569;--text:#0f172a;--text-dim:#64748b;--text-bright:#0284c7;--border:#94a3b8;--font-term:"Consolas","Courier New",ui-monospace,Menlo,Monaco,monospace}
*{box-sizing:border-box;border-radius:0!important;outline:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:12px/1.4 var(--font-term);letter-spacing:.02em;overflow:hidden}
#app{display:grid;grid-template-columns:1fr 340px;grid-template-rows:42px 1fr;height:100%}
header{grid-column:1/3;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--panel-bar);border-bottom:1px solid var(--line);position:relative;z-index:10}
header b{font-size:12px;color:var(--text);letter-spacing:.08em;white-space:nowrap;font-weight:700}
header .prompt{color:var(--text-dim);font-size:11px}
header .stat{color:var(--text-dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px;border-left:1px solid var(--line);padding-left:8px}
.search-box{display:flex;align-items:center;background:#fff;border:1px solid var(--line);padding:2px 6px;gap:4px;margin-left:6px}
.search-box input{background:none;border:none;color:var(--text);font:11px var(--font-term);width:110px}
.search-box .clear-btn{cursor:pointer;color:var(--text-dim);font-size:10px;display:none;background:none;border:none;padding:0}
.search-box .clear-btn:hover{color:var(--text)}.search-box .match-badge{font-size:10px;color:var(--text-bright);font-weight:700}
#toolbar{margin-left:auto;display:flex;align-items:center;gap:4px}
button,select{background:#fff;color:var(--text);border:1px solid var(--line);padding:3px 7px;cursor:pointer;font:11px var(--font-term);letter-spacing:.04em;text-transform:uppercase;transition:all .1s}
button:hover,select:hover{background:var(--panel-bar);border-color:var(--line-dark);color:var(--text-bright)}button:active{background:#e2e8f0}select option{background:#fff;color:var(--text)}
#stage{position:relative;overflow:hidden;background:#ffffff}
#wind{display:none}#svg{position:relative;z-index:1;width:100%;height:100%;display:block;cursor:default}#svg.panning{cursor:grab}
#filter-bar{position:absolute;top:8px;left:10px;z-index:4;display:flex;gap:3px;flex-wrap:wrap;background:rgba(255,255,255,.94);padding:3px 6px;border:1px solid var(--line)}
.filter-chip{background:#fff;color:var(--text-dim);border:1px solid var(--line);padding:1px 5px;font-size:10px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.filter-chip:hover{color:var(--text);border-color:var(--line-dark)}.filter-chip.active{background:var(--text);color:#fff;border-color:var(--text);font-weight:700}
#hud-zoom{position:absolute;right:10px;top:8px;z-index:4;background:rgba(255,255,255,.94);border:1px solid var(--line);padding:2px 6px;font-size:11px;color:var(--text-dim)}
#panel{background:var(--panel);border-left:1px solid var(--line);padding:12px;overflow-y:auto;position:relative;z-index:5}
#panel h2{font-size:11px;margin:12px 0 4px;color:var(--text-dim);letter-spacing:.08em;border-bottom:1px solid var(--line);padding-bottom:2px;cursor:pointer;display:flex;justify-content:space-between;user-select:none}
#panel h2:hover{color:var(--text-bright)}
#panel .label{font-size:14px;font-weight:700;margin-bottom:2px;word-break:break-all;color:var(--text)}#panel .kind{display:inline-block;font-size:10px;color:var(--text-dim);margin-bottom:8px}
#panel .actions{display:flex;gap:4px;margin:6px 0 10px}#panel .actions button{font-size:10px;padding:3px 6px;flex:1}
#panel ul{padding-left:0;margin:4px 0 10px;list-style:none}#panel ul.collapsed{display:none}
#panel li{color:var(--text-dim);margin:3px 0;padding:4px 6px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;gap:6px;font-size:11px;cursor:pointer}
#panel li:hover{border-color:var(--text-bright);color:var(--text);background:#f0f9ff}#panel li b{color:var(--text);font-weight:600}#panel li .tag{margin-left:auto;font-size:9px;color:var(--text-dim);background:var(--panel-bar);padding:1px 4px;border:1px solid var(--line)}
#legend{position:absolute;left:10px;bottom:8px;z-index:2;background:rgba(255,255,255,.94);border:1px solid var(--line);padding:4px 8px;display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100% - 20px)}
#legend span{display:inline-flex;align-items:center;gap:4px;color:var(--text-dim);font-size:10px}.dot{width:7px;height:7px;border:1px solid #64748b;display:inline-block}
#hint{position:absolute;right:10px;bottom:8px;z-index:2;color:var(--text-dim);font-size:10px;background:rgba(255,255,255,.94);padding:3px 6px;border:1px solid var(--line)}
#drop{position:absolute;inset:0;z-index:8;display:none;place-items:center;background:rgba(241,245,249,.85)}#drop.hot{display:grid}
#drop .box{width:min(480px,90%);padding:28px;border:2px dashed var(--line-dark);background:#fff;text-align:center;color:var(--text)}#drop small{display:block;margin-top:8px;color:var(--text-dim);font-size:10px}
#drop .preset-row{margin-top:14px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.node{cursor:pointer;transition:opacity .1s}.node text{font-size:11px;pointer-events:none;user-select:none;font-family:var(--font-term)}
.node .node-box{stroke-width:1;stroke:var(--line-dark);fill:#ffffff}.node .node-header{stroke-width:1;stroke:var(--line-dark)}
.node:hover .node-box{stroke:#0284c7;stroke-width:1.5}.node.selected .node-box{stroke:#0284c7;stroke-width:2.5;fill:#f0f9ff}.node.match .node-box{stroke:#d97706;stroke-width:2}.node.dim{opacity:.12}.node.marked .node-box{stroke:#d97706;stroke-width:2.5}.node.marked .node-header{fill:#fef3c7}.star{fill:#d97706;font-size:12px;font-weight:700}.lod-far .node text{display:none}.lod-far .edge-label{opacity:0!important}
.edge{fill:none;stroke:#64748b;stroke-width:1.3}.edge.hl{stroke:#0284c7;stroke-width:2.2}.edge.dim{opacity:.10}
@keyframes signalFlow{0%{stroke-dashoffset:24}100%{stroke-dashoffset:0}}
.edge.pulse{stroke:#0284c7!important;stroke-width:2.4!important;stroke-dasharray:4 3;animation:signalFlow .5s linear infinite}
.edge-label{fill:#475569;font-size:9px;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:2px;opacity:0;font-family:var(--font-term)}.edge-label.hl{fill:#0284c7;opacity:1}.show-labels .edge-label{opacity:1}
.via{fill:#475569;stroke:#fff;stroke-width:1}.frame{fill:none;stroke-dasharray:4 3;stroke-width:1.2;cursor:pointer}.frame-bg{fill:rgba(248,250,252,.5);cursor:pointer}.frame-btn{font-size:10px;font-family:var(--font-term);cursor:pointer;user-select:none}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:#f1f5f9}::-webkit-scrollbar-thumb{background:#cbd5e1}
@media (max-width:820px){#app{grid-template-columns:1fr;grid-template-rows:42px 1fr 220px}#panel{border-left:0;border-top:1px solid var(--line)}.search-box{display:none}}
</style>
</head>
<body>
<div id="app">
<header>
  <b>[IDA GRAPH]</b><span class="prompt">&gt; NETLIST_CFG</span><span class="stat" id="stats"></span>
  <div class="search-box">
    <input id="search-input" type="text" placeholder="SEARCH / 搜索..." spellcheck="false">
    <button class="clear-btn" id="search-clear">[X]</button><span class="match-badge" id="search-count"></span>
  </div>
  <div id="toolbar">
    <select id="preset-select" title="Load demo graph">
      <option value="">[PRESETS / 预设]</option>
      <option value="netgraph">PROJECT: MULTI_NS</option>
      <option value="ladder">LADDER: 15_PTR</option>
      <option value="slices">SLICES: BIT_BYTE</option>
      <option value="landmine">LOCK: LANDMINE_GATES</option>
    </select>
    <button id="fit">[FIT / 适配]</button><button id="reset">[RESET / 重置]</button>
    <button id="fold-all" title="Toggle all namespace folds">[FOLD / 折叠全部]</button>
    <button id="wire-style">[ORTHO / 正交]</button><button id="wires">[WIRES: OFF]</button><button id="live" title="poll netgraph.json (serve over HTTP)">[LIVE: OFF]</button><button id="labels">[LABELS / 连线名]</button>
    <button id="lang-btn">[EN / 中文]</button>
  </div>
</header>
<div id="stage">
  <canvas id="wind"></canvas>
  <div id="filter-bar"></div>
  <div id="hud-zoom"><span id="zoom-val">100%</span></div>
  <svg id="svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
      <marker id="arrow-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker>
    </defs>
    <g id="viewport"><g id="frames"></g><g id="edges"></g><g id="nodes"></g></g>
  </svg>
  <div id="drop">
    <div class="box">[ DROP GRAPH .JSON ]<br><small>&gt; sigilc --netlist --netlist-format json -o graph.json</small>
      <div class="preset-row"><button onclick="loadPreset('netgraph')">[DEMO_PROJECT]</button><button onclick="loadPreset('ladder')">[15_LADDER]</button><button onclick="loadPreset('slices')">[SLICES]</button></div>
    </div>
  </div>
  <div id="legend"></div><div id="hint">[DRAG:PAN · WHEEL:ZOOM · CLICK:INSPECT]</div>
</div>
<aside id="panel"><h2>[INSPECTOR / 检视器]</h2><div id="detail">&gt; AWAITING TARGET SELECTION.</div></aside>
</div>

function draw(){

    nodes.filter(n=>nsOfNode(n)===ns).forEach(n=>ids.add(n.id));
    let changed = true;
    while(changed){changed=false;edges.forEach(e=>{if(ids.has(e.source)&&!ids.has(e.target)&&["binds","field","alias","local-alias"].includes(e.kind)){ids.add(e.target);changed=true;}});}
    const members = nodes.filter(n=>ids.has(n.id));
    if(collapsedSets.has(nsKey)){members.forEach(n=>hiddenNodeIds.add(n.id));hiddenNodeIds.add(nsKey);}

  });

  });
