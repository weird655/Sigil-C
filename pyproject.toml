[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sigil-c"
version = "1.1.0"
description = "A small experiment that transpiles .sigil to ISO C99"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["c99", "transpiler", "compiler", "sigil"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C",
  "Topic :: Software Development :: Compilers",
]

[project.scripts]
sigilc = "sigilc:cli"
sigil = "sigilc:cli"

[tool.setuptools]
py-modules = ["sigilc"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# 中文注释按显示宽度算会普遍超过 88/120，长行不交给机器判；E701 是解析器里有意的紧凑单行
ignore = ["E501", "E701"]

[tool.mypy]
python_version = "3.10"
files = ["sigilc.py"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["sigilc"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_empty = true
