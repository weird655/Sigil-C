[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sigil-c"
version = "1.1.0"
description = "A small experiment that transpiles .sigil to ISO C99"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["c99", "transpiler", "compiler", "sigil"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C",
  "Topic :: Software Development :: Compilers",
]

[project.scripts]
sigilc = "sigilc:cli"
sigil = "sigilc:cli"

[tool.setuptools]
py-modules = ["sigilc"]
